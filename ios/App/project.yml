name: MakingTracks
options:
  deploymentTarget:
    iOS: "18.0"
attributes:
  LastUpgradeCheck: "2620"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.making-tracks.MakingTracks
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Rob's personal team — lets the app run on-device without local pbxproj edits.
    DEVELOPMENT_TEAM: BU7526J4QY
    CODE_SIGN_STYLE: Automatic
    # Xcode "recommended settings" — pinned here so the generated project stops prompting.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  MakingTracksData:
    path: ..
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.27.0"
targets:
  MakingTracks:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - Resources/Fonts
    resources:
      - Sources/OSSCredits.json
      - Assets.xcassets
    dependencies:
      - package: MakingTracksData
        product: MakingTracksData
      - package: MakingTracksData
        product: MakingTracksTiles
      - package: MakingTracksData
        product: MakingTracksMapStyle
      - package: MakingTracksData
        product: MakingTracksCore
      - package: MakingTracksData
        product: DesignSystem
      - package: MapLibre
        product: MapLibre
    postBuildScripts:
      - name: Stamp Build Git Commit
        basedOnDependencyAnalysis: false
        inputFiles:
          # The first path is the checkout/worktree .git entry. The second path
          # is the common Git directory for the repo's required agent worktrees.
          - $(SRCROOT)/../../.git
          - $(SRCROOT)/../../../../.git
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/BuildInfo.plist
        script: |
          set -euo pipefail

          commit="$(git -C "$SRCROOT/../.." rev-parse --short HEAD)"
          plist="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          mkdir -p "$(dirname "$plist")"

          cat > "$plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GitCommit</key>
            <string>$commit</string>
          </dict>
          </plist>
          PLIST
      - name: Copy World Basemap
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Resources/protomaps-20260714-z0-6.pmtiles
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/protomaps-20260714-z0-6.pmtiles
        script: |
          set -euo pipefail

          source="$SRCROOT/Resources/protomaps-20260714-z0-6.pmtiles"
          target="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/protomaps-20260714-z0-6.pmtiles"
          mkdir -p "$(dirname "$target")"
          cp "$source" "$target"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Making Tracks
        NSLocationWhenInUseUsageDescription: Making Tracks uses your location while the app is open to show where you are on the map. Location stays on device and is never sent anywhere.
        UIAppFonts:
          - Newsreader72pt-SemiBold.ttf
          - Newsreader16pt-SemiBold.ttf
          - Newsreader16pt-Bold.ttf
          - Newsreader16pt-Italic.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  MakingTracksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MakingTracks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.making-tracks.MakingTracksTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MakingTracks.app/MakingTracks
  MakingTracksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MakingTracks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.making-tracks.MakingTracksUITests
        TEST_TARGET_NAME: MakingTracks
    postBuildScripts:
      - name: Stamp UI Test Build Git Commit
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../.git
          - $(SRCROOT)/../../../../.git
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/BuildInfo.plist
        script: |
          set -euo pipefail

          commit="$(git -C "$SRCROOT/../.." rev-parse --short HEAD)"
          plist="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          mkdir -p "$(dirname "$plist")"

          cat > "$plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GitCommit</key>
            <string>$commit</string>
          </dict>
          </plist>
          PLIST
