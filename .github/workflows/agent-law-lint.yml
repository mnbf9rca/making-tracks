name: agent-law-lint

# No `paths:` filter on purpose. A path-filtered check never reports on a PR
# that touches none of those paths, and a required-but-unreported check blocks
# merge forever. Running always keeps it safe to mark required.
on:
  pull_request:
  push:
    branches: [develop, ios]

jobs:
  timeless-rule-text:
    name: "rule text carries no dated narrative"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/lint_agent_law.py
