name: iOS Release Gate

on:
  pull_request:
    branches: [ios]
    paths:
      - ".github/workflows/ios-gate.yml"
      - "scripts/release-gate.sh"
      - "ios/App/**"
      - "ios/Sources/**"
      - "ios/Tests/**"
      - "ios/Package.swift"
      - "ios/Package.resolved"
  workflow_dispatch:

concurrency:
  group: ios-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-release-gate:
    name: ios-release-gate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MT_CI_SIMULATOR_NAME: iPhone 16
      MT_CI_XCBEAUTIFY_SHA256: 87fdbe786f71d7b2ee28c5c1ca97087587292f2c5c6f9e721cf02db8b2a3c241
      MT_CI_XCBEAUTIFY_VERSION: 3.2.1
      MT_RELEASE_GATE_SKIP_LOCK: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -n "${MT_CI_XCODE_PATH:-}" ]; then
            sudo xcode-select -s "$MT_CI_XCODE_PATH"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Configure release gate paths
        run: |
          set -euo pipefail
          {
            echo "MT_RELEASE_GATE_RUN_DIR=$RUNNER_TEMP/release-gate"
            echo "MT_RELEASE_GATE_DERIVED_DATA=$RUNNER_TEMP/release-gate/DerivedData"
          } >> "$GITHUB_ENV"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('ios/Package.swift', 'ios/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Install xcbeautify
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcbeautify.zip"
          install_dir="$RUNNER_TEMP/xcbeautify"
          curl -fsSLo "$archive" "https://github.com/cpisciotta/xcbeautify/releases/download/$MT_CI_XCBEAUTIFY_VERSION/xcbeautify-$MT_CI_XCBEAUTIFY_VERSION-universal-apple-macosx.zip"
          echo "$MT_CI_XCBEAUTIFY_SHA256  $archive" | shasum -a 256 -c -
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          xcbeautify_bin="$(find "$install_dir" -type f -name xcbeautify -print -quit)"
          if [ -z "$xcbeautify_bin" ]; then
            echo "xcbeautify binary missing from release archive" >&2
            exit 1
          fi
          chmod +x "$xcbeautify_bin"
          dirname "$xcbeautify_bin" >> "$GITHUB_PATH"
          "$xcbeautify_bin" --version

      - name: Resolve simulator destination
        run: |
          set -euo pipefail
          mkdir -p "$MT_RELEASE_GATE_RUN_DIR"
          receipt="$MT_RELEASE_GATE_RUN_DIR/environment.txt"
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "xcode_path=$(xcode-select -p)"
            xcodebuild -version
            echo
            xcrun simctl list runtimes
          } > "$receipt"

          runtime_id="$(
            xcrun simctl list runtimes -j |
            /usr/bin/python3 -c 'import json, sys; data = json.load(sys.stdin); candidates = [item for item in data.get("runtimes", []) if item.get("isAvailable") and str(item.get("identifier", "")).startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; assert candidates, "no available iOS simulator runtime"; version_key = lambda item: tuple(int(part) for part in str(item.get("version", "0")).split(".") if part.isdigit()); print(max(candidates, key=version_key)["identifier"])'
          )"
          device_type="$(
            xcrun simctl list devicetypes -j |
            MT_CI_SIMULATOR_NAME="$MT_CI_SIMULATOR_NAME" /usr/bin/python3 -c 'import json, os, sys; data = json.load(sys.stdin); preferred = os.environ["MT_CI_SIMULATOR_NAME"]; devices = [item for item in data.get("devicetypes", []) if str(item.get("name", "")).startswith("iPhone")]; assert devices, "no available iPhone simulator device type"; by_name = {item.get("name"): item for item in devices}; chosen = by_name.get(preferred) or devices[-1]; print(chosen["identifier"])'
          )"
          udid="$(
            xcrun simctl create "Making Tracks CI" "$device_type" "$runtime_id"
          )"
          echo "MT_CI_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "MT_RELEASE_GATE_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          {
            echo "simulator_name=$MT_CI_SIMULATOR_NAME"
            echo "simulator_device_type=$device_type"
            echo "simulator_runtime=$runtime_id"
            echo "simulator_udid=$udid"
            echo "destination=platform=iOS Simulator,id=$udid"
          } >> "$receipt"

      - name: Run release gate
        run: ./scripts/release-gate.sh

      - name: Capture simulator screenshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$MT_RELEASE_GATE_RUN_DIR"
          if [ -n "${MT_CI_SIMULATOR_UDID:-}" ]; then
            xcrun simctl io "$MT_CI_SIMULATOR_UDID" screenshot "$MT_RELEASE_GATE_RUN_DIR/screenshot.png" || true
          fi

      - name: Upload release-gate artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-release-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-gate/environment.txt
            ${{ runner.temp }}/release-gate/*.xcodebuild.log
            ${{ runner.temp }}/release-gate/screenshot.png
            ${{ runner.temp }}/release-gate/MakingTracksTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
