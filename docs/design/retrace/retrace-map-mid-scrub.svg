<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Retrace map mid-scrub with dashed arcs and appearing pins">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f2e8"/>
      <stop offset=".6" stop-color="#e9f0e8"/>
      <stop offset="1" stop-color="#e2eceb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c2421" flood-opacity="0.24"/>
    </filter>
    <filter id="pinShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#28312d" flood-opacity="0.28"/>
    </filter>
    <symbol id="pinRed" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#d64b3c" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinTeal" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#247b74" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinGold" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#d6aa2f" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <style>
      .label { font-family: Helvetica; letter-spacing: 0; }
      .map-label { font-size: 11px; font-weight: 590; fill: #68756f; }
      .small { font-size: 12px; font-weight: 650; }
      .title { font-size: 19px; font-weight: 780; }
      .road { fill: none; stroke: #fffdf7; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .road-line { fill: none; stroke: #d9ddd3; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .visited-arc { fill: none; stroke: #2d8c83; stroke-width: 6.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 9; opacity: .76; }
      .active-arc { fill: none; stroke: #db5344; stroke-width: 7.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 9; opacity: .88; }
      .tick { stroke: #6f7c74; stroke-width: 2; stroke-linecap: round; opacity: .78; }
    </style>
  </defs>

  <rect width="390" height="844" rx="42" fill="#101514"/>
  <rect x="12" y="12" width="366" height="820" rx="34" fill="url(#paper)"/>

  <g clip-path="inset(12 round 34)">
    <rect x="12" y="12" width="366" height="820" fill="#f3f0e7"/>
    <path d="M250 0c25 58 34 112 11 157-18 34-55 54-73 87-25 45-8 93-28 132-24 46-87 54-104 100-19 53 23 96 7 153-12 45-51 76-53 132h368V0z" fill="#b8d7dc" opacity=".8"/>
    <path d="M18 91c48-33 97-28 126-3 23 20 21 54-7 74-42 29-93 20-119 3z" fill="#cfe0c9"/>
    <path d="M53 588c60-29 119-13 135 30 15 39-21 76-81 75-49 0-84-24-89-57-4-22 9-37 35-48z" fill="#cfe0c9"/>

    <g opacity=".94">
      <path class="road" d="M-24 248C51 226 83 205 149 214c60 8 92 56 158 51 55-5 87-27 130-60"/>
      <path class="road-line" d="M-24 248C51 226 83 205 149 214c60 8 92 56 158 51 55-5 87-27 130-60"/>
      <path class="road" d="M47 20c35 68 57 126 53 189-4 66-42 106-35 173 8 72 62 104 70 170 7 63-26 105-61 164"/>
      <path class="road-line" d="M47 20c35 68 57 126 53 189-4 66-42 106-35 173 8 72 62 104 70 170 7 63-26 105-61 164"/>
      <path class="road" d="M359 64c-75 61-109 111-106 169 3 62 49 87 48 149 0 67-57 114-56 183 1 51 34 86 73 124"/>
      <path class="road-line" d="M359 64c-75 61-109 111-106 169 3 62 49 87 48 149 0 67-57 114-56 183 1 51 34 86 73 124"/>
      <path class="road" d="M-10 466c66-24 132-27 197-8 78 22 125 76 213 69"/>
      <path class="road-line" d="M-10 466c66-24 132-27 197-8 78 22 125 76 213 69"/>
    </g>

    <text class="label map-label" x="130" y="236" transform="rotate(8 130 236)">High Street</text>
    <text class="label map-label" x="220" y="486" transform="rotate(10 220 486)">Market Lane</text>
    <text class="label map-label" x="57" y="404" transform="rotate(83 57 404)">Foundry Walk</text>

    <path class="visited-arc" d="M95 226C132 178 177 172 211 204"/>
    <path class="visited-arc" d="M211 204C240 224 260 243 277 280"/>
    <path class="active-arc" d="M277 280C254 337 226 386 240 462"/>
    <g>
      <circle cx="240" cy="462" r="24" fill="none" stroke="#db5344" stroke-width="3" opacity=".28"/>
      <circle cx="240" cy="462" r="34" fill="none" stroke="#db5344" stroke-width="2" opacity=".16"/>
    </g>

    <g filter="url(#pinShadow)">
      <use href="#pinRed" x="77" y="196" width="36" height="46"/>
      <use href="#pinTeal" x="193" y="174" width="36" height="46"/>
      <use href="#pinGold" x="259" y="250" width="36" height="46"/>
      <use href="#pinRed" x="222" y="432" width="36" height="46"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="26" y="54" width="206" height="92" rx="23" fill="#fffdf8"/>
    <text class="label title" x="58" y="82">Retrace</text>
    <text class="label small" x="58" y="99" fill="#637069">Sat 18 Jul</text>
    <path d="M45 73l-9 9 9 9" fill="none" stroke="#3d4842" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="58" y="119" style="font-size:10px;font-weight:740" fill="#27312d">Scope: KL walk, Historic</text>
    <text class="label" x="58" y="133" style="font-size:10px;font-weight:680" fill="#64716a">Filtered track - 11 visits</text>
    <rect x="244" y="61" width="120" height="44" rx="22" fill="#20312c"/>
    <circle cx="265" cy="83" r="7" fill="none" stroke="#f8efe3" stroke-width="2"/>
    <path d="M265 79v5l4 2" stroke="#f8efe3" stroke-width="2" stroke-linecap="round"/>
    <text class="label small" x="281" y="88" fill="#f8efe3">11 places</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="24" y="650" width="342" height="126" rx="30" fill="#fffdf8"/>
    <circle cx="58" cy="704" r="18" fill="#20312c"/>
    <path d="M54 695l15 9-15 9z" fill="#f8efe3"/>
    <text class="label" x="88" y="693" style="font-size:13px;font-weight:700">14:20</text>
    <text class="label" x="88" y="712" style="font-size:20px;font-weight:780">Old market arcade</text>
    <text class="label small" x="88" y="731" fill="#64716a">Visit 4 of 11</text>
    <line x1="48" y1="754" x2="342" y2="754" stroke="#d8ded7" stroke-width="9" stroke-linecap="round"/>
    <line x1="48" y1="754" x2="183" y2="754" stroke="#2d8c83" stroke-width="9" stroke-linecap="round"/>
    <line x1="183" y1="754" x2="223" y2="754" stroke="#db5344" stroke-width="9" stroke-linecap="round"/>
    <g>
      <line class="tick" x1="48" y1="740" x2="48" y2="766"/>
      <line class="tick" x1="86" y1="744" x2="86" y2="764"/>
      <line class="tick" x1="139" y1="744" x2="139" y2="764"/>
      <line class="tick" x1="183" y1="738" x2="183" y2="770"/>
      <line class="tick" x1="223" y1="744" x2="223" y2="764"/>
      <line class="tick" x1="280" y1="744" x2="280" y2="764"/>
      <line class="tick" x1="342" y1="740" x2="342" y2="766"/>
    </g>
    <rect x="202" y="735" width="42" height="38" rx="19" fill="#fffdf8" stroke="#db5344" stroke-width="4"/>
    <text class="label" x="39" y="736" style="font-size:10px;font-weight:650" fill="#64716a">10:05</text>
    <text class="label" x="313" y="736" style="font-size:10px;font-weight:650" fill="#64716a">17:40</text>
  </g>

  <rect x="154" y="24" width="82" height="5" rx="2.5" fill="#0f1412" opacity=".86"/>
  <line x1="24" y1="812" x2="366" y2="812" stroke="#20312c" stroke-width="1" stroke-dasharray="4 7" opacity=".22"/>
</svg>
