<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="My tracks list detail with All and Loved segmented filter beside the ratified map chip treatment">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c2421" flood-opacity="0.14"/>
    </filter>
    <filter id="pinShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#28312d" flood-opacity="0.24"/>
    </filter>
    <symbol id="pinRed" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#d64b3c" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinTeal" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#247b74" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <style>
      .label { font-family: Helvetica; letter-spacing: 0; }
      .primary { fill: #23221f; }
      .secondary { fill: #686158; }
      .caption { fill: #7b7469; font-size: 12px; font-weight: 700; }
      .screen { fill: #f7f3e8; }
      .nav { fill: #fbf8ee; }
      .row { fill: #fffaf0; }
      .muted { fill: #eee7d8; }
      .accent { fill: #0f766b; }
      .hairline { stroke: #d8d0c0; stroke-width: 1; }
      .icon { fill: none; stroke: #6d665c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .heart { fill: #b8322d; stroke: #b8322d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .road { fill: none; stroke: #fffdf7; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .road-line { fill: none; stroke: #d9ddd3; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
      .visited-arc { fill: none; stroke: #2d8c83; stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 7; opacity: .76; }
    </style>
  </defs>

  <rect class="screen" width="390" height="844"/>
