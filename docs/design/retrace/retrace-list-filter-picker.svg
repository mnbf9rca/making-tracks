  <text class="label primary" x="195" y="59" font-size="17" font-weight="700" text-anchor="middle">My tracks</text>
  <path class="icon" d="M342 50h18M342 57h18M342 64h18"/>

  <g filter="url(#shadow)">
    <rect class="row" x="16" y="118" width="358" height="186" rx="8"/>
