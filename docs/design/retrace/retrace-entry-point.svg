<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Making Tracks map with obvious Retrace entry point">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ed"/>
      <stop offset="1" stop-color="#e8efe8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c2421" flood-opacity="0.22"/>
    </filter>
    <symbol id="pinRed" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#d64b3c" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinTeal" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#247b74" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinGold" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#d6aa2f" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinPurple" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#7b5eb1" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="#f8efe3" stroke-width="2"/>
      <path d="M12 7v5l4 2" fill="none" stroke="#f8efe3" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <style>
      .label { font-family: Helvetica; }
      .small { font-size: 12px; font-weight: 650; }
      .tiny { font-size: 10px; font-weight: 620; letter-spacing: 0; }
      .map-label { font-size: 11px; font-weight: 590; fill: #69736e; }
      .road { fill: none; stroke: #fffdf7; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .road-line { fill: none; stroke: #d8ddd4; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .park { fill: #cfe2c9; opacity: .88; }
      .water { fill: #b8d7dc; opacity: .88; }
      .block { fill: #ece9df; stroke: #dad7cc; stroke-width: .7; }
    </style>
  </defs>

  <rect width="390" height="844" rx="42" fill="#0f1412"/>
  <rect x="12" y="12" width="366" height="820" rx="34" fill="url(#screen)"/>

  <g clip-path="inset(12 round 34)">
    <rect x="12" y="12" width="366" height="820" fill="#f4f1e8"/>
    <path class="water" d="M250 0c23 61 33 113 11 159-17 35-54 56-73 89-27 46-7 95-29 134-23 42-82 54-100 99-22 55 23 96 4 153-14 42-51 74-53 125l368 0V0z"/>
    <path class="park" d="M16 94c44-34 97-31 127-5 22 19 22 53-3 72-41 31-95 24-124 6z"/>
    <path class="park" d="M66 594c58-26 117-10 133 33 15 39-22 74-83 72-47-1-85-24-90-58-3-21 12-36 40-47z"/>

    <g opacity=".9">
      <path class="road" d="M-30 250C50 226 85 204 150 214c58 9 89 57 158 51 54-5 84-27 126-61"/>
      <path class="road-line" d="M-30 250C50 226 85 204 150 214c58 9 89 57 158 51 54-5 84-27 126-61"/>
      <path class="road" d="M43 20c35 68 58 127 55 189-3 67-42 106-35 173 8 72 62 103 70 169 7 63-25 105-60 164"/>
      <path class="road-line" d="M43 20c35 68 58 127 55 189-3 67-42 106-35 173 8 72 62 103 70 169 7 63-25 105-60 164"/>
      <path class="road" d="M362 64c-77 61-110 110-107 169 3 62 48 86 48 148 0 68-58 115-57 184 1 50 33 84 73 124"/>
      <path class="road-line" d="M362 64c-77 61-110 110-107 169 3 62 48 86 48 148 0 68-58 115-57 184 1 50 33 84 73 124"/>
      <path class="road" d="M-10 466c65-23 132-26 196-8 78 22 125 76 214 69"/>
      <path class="road-line" d="M-10 466c65-23 132-26 196-8 78 22 125 76 214 69"/>
    </g>

    <g opacity=".66">
      <rect class="block" x="130" y="52" width="66" height="46" rx="7"/>
      <rect class="block" x="211" y="68" width="70" height="52" rx="7"/>
      <rect class="block" x="117" y="281" width="92" height="50" rx="7"/>
      <rect class="block" x="224" y="319" width="80" height="57" rx="7"/>
      <rect class="block" x="148" y="529" width="58" height="82" rx="7"/>
      <rect class="block" x="245" y="601" width="82" height="55" rx="7"/>
    </g>

    <text class="label map-label" x="143" y="236" transform="rotate(8 143 236)">High Street</text>
    <text class="label map-label" x="220" y="485" transform="rotate(10 220 485)">Market Lane</text>
    <text class="label map-label" x="59" y="403" transform="rotate(83 59 403)">Foundry Walk</text>

    <use href="#pinRed" x="91" y="214" width="28" height="36"/>
    <use href="#pinTeal" x="198" y="185" width="28" height="36"/>
    <use href="#pinGold" x="269" y="264" width="28" height="36"/>
    <use href="#pinPurple" x="72" y="435" width="28" height="36"/>
    <use href="#pinRed" x="229" y="462" width="28" height="36"/>
    <use href="#pinTeal" x="309" y="563" width="28" height="36"/>
  </g>

  <rect x="26" y="55" width="252" height="44" rx="22" fill="#fffdf8" filter="url(#softShadow)"/>
  <circle cx="49" cy="77" r="7" fill="none" stroke="#53605a" stroke-width="2"/>
  <path d="M54 82l7 7" stroke="#53605a" stroke-width="2" stroke-linecap="round"/>
  <text class="label small" x="72" y="82">Search places</text>

  <g filter="url(#softShadow)">
    <rect x="292" y="55" width="42" height="42" rx="21" fill="#fffdf8"/>
    <path d="M313 66v22M302 77h22" stroke="#3a4640" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="340" y="55" width="28" height="42" rx="14" fill="#fffdf8"/>
    <circle cx="354" cy="68" r="2.3" fill="#3a4640"/>
    <circle cx="354" cy="77" r="2.3" fill="#3a4640"/>
    <circle cx="354" cy="86" r="2.3" fill="#3a4640"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="30" y="690" width="330" height="82" rx="28" fill="#fffdf8"/>
    <rect x="41" y="701" width="148" height="60" rx="22" fill="#edf3ec"/>
    <text class="label small" x="77" y="736">Fresh snow</text>
    <circle cx="61" cy="731" r="9" fill="#fffdf8" stroke="#8da09a" stroke-width="2"/>
    <path d="M57 731h8M61 727v8" stroke="#8da09a" stroke-width="2" stroke-linecap="round"/>
    <rect x="195" y="701" width="154" height="60" rx="22" fill="#20312c"/>
    <g transform="translate(214 719)" color="#f8efe3">
      <use href="#clock" width="24" height="24"/>
    </g>
    <text class="label" x="247" y="730" fill="#f8efe3" style="font-size:15px;font-weight:760">Retrace</text>
    <text class="label tiny" x="247" y="747" fill="#cfe6dc">14 places</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="308" y="614" width="44" height="44" rx="22" fill="#fffdf8"/>
    <path d="M330 626l8 22-8-5-8 5z" fill="#3f4b45"/>
  </g>

  <rect x="154" y="24" width="82" height="5" rx="2.5" fill="#0f1412" opacity=".86"/>
  <line x1="24" y1="812" x2="366" y2="812" stroke="#20312c" stroke-width="1" stroke-dasharray="4 7" opacity=".22"/>
</svg>
