<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Retrace filter picker showing list and place type selection">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ea"/>
      <stop offset=".62" stop-color="#e9f0e8"/>
      <stop offset="1" stop-color="#dfeceb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c2421" flood-opacity=".24"/>
    </filter>
    <filter id="pinShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#28312d" flood-opacity=".25"/>
    </filter>
    <symbol id="pinRed" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#d64b3c" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinTeal" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#247b74" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <symbol id="pinGold" viewBox="0 0 36 46"><path d="M18 44C10 33 4 25 4 16 4 7 10 1 18 1s14 6 14 15c0 9-6 17-14 28z" fill="#d6aa2f" stroke="#fffaf2" stroke-width="3"/><circle cx="18" cy="16" r="5.5" fill="#fffaf2"/></symbol>
    <style>
      .label { font-family: Helvetica, Arial, sans-serif; letter-spacing: 0; }
      .title { font-size: 20px; font-weight: 780; fill: #24302b; }
      .small { font-size: 12px; font-weight: 650; }
      .tiny { font-size: 10px; font-weight: 700; }
      .micro { font-size: 9px; font-weight: 720; }
      .map-label { font-size: 11px; font-weight: 590; fill: #68756f; }
      .road { fill: none; stroke: #fffdf7; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .road-line { fill: none; stroke: #d9ddd3; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .visited-arc { fill: none; stroke: #2d8c83; stroke-width: 6.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 9; opacity: 1; }
      .active-arc { fill: none; stroke: #dd6354; stroke-width: 7.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 9; opacity: .90; }
      .chip-text { font-size: 11px; font-weight: 760; }
      .row-text { font-size: 13px; font-weight: 720; }
      .muted { fill: #65736b; }
      .check { fill: none; stroke: #fffaf2; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .empty-check { fill: none; stroke: #7c8981; stroke-width: 2; }
    </style>
  </defs>

  <rect width="390" height="844" rx="42" fill="#101514"/>
  <rect x="12" y="12" width="366" height="820" rx="34" fill="url(#paper)"/>

  <g clip-path="inset(12 round 34)">
    <rect x="12" y="12" width="366" height="820" fill="#f3f0e7"/>
    <path d="M250 0c25 58 34 112 11 157-18 34-55 54-73 87-25 45-8 93-28 132-24 46-87 54-104 100-19 53 23 96 7 153-12 45-51 76-53 132h368V0z" fill="#b8d7dc" opacity=".8"/>
    <path d="M18 91c48-33 97-28 126-3 23 20 21 54-7 74-42 29-93 20-119 3z" fill="#cfe0c9"/>
    <path d="M53 588c60-29 119-13 135 30 15 39-21 76-81 75-49 0-84-24-89-57-4-22 9-37 35-48z" fill="#cfe0c9"/>

    <g opacity=".94">
      <path class="road" d="M-24 248C51 226 83 205 149 214c60 8 92 56 158 51 55-5 87-27 130-60"/>
      <path class="road-line" d="M-24 248C51 226 83 205 149 214c60 8 92 56 158 51 55-5 87-27 130-60"/>
      <path class="road" d="M47 20c35 68 57 126 53 189-4 66-42 106-35 173 8 72 62 104 70 170 7 63-26 105-61 164"/>
      <path class="road-line" d="M47 20c35 68 57 126 53 189-4 66-42 106-35 173 8 72 62 104 70 170 7 63-26 105-61 164"/>
      <path class="road" d="M359 64c-75 61-109 111-106 169 3 62 49 87 48 149 0 67-57 114-56 183 1 51 34 86 73 124"/>
      <path class="road-line" d="M359 64c-75 61-109 111-106 169 3 62 49 87 48 149 0 67-57 114-56 183 1 51 34 86 73 124"/>
      <path class="road" d="M-10 466c66-24 132-27 197-8 78 22 125 76 213 69"/>
      <path class="road-line" d="M-10 466c66-24 132-27 197-8 78 22 125 76 213 69"/>
    </g>

    <text class="label map-label" x="130" y="236" transform="rotate(8 130 236)">High Street</text>
    <text class="label map-label" x="220" y="486" transform="rotate(10 220 486)">Market Lane</text>
    <text class="label map-label" x="57" y="404" transform="rotate(83 57 404)">Foundry Walk</text>

    <path class="visited-arc" d="M95 226C132 178 177 172 211 204"/>
    <path class="visited-arc" d="M211 204C240 224 260 243 277 280"/>
    <path class="active-arc" d="M277 280C254 337 226 386 240 462"/>

    <g filter="url(#pinShadow)">
      <use href="#pinRed" x="77" y="196" width="36" height="46"/>
      <use href="#pinTeal" x="193" y="174" width="36" height="46"/>
      <use href="#pinGold" x="259" y="250" width="36" height="46"/>
      <use href="#pinRed" x="222" y="432" width="36" height="46"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="24" y="54" width="342" height="116" rx="24" fill="#fffdf8"/>
    <text class="label title" x="58" y="83">Retrace</text>
    <text class="label small muted" x="58" y="103">27 visits</text>
    <path d="M45 74l-9 9 9 9" fill="none" stroke="#3d4842" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="242" y="64" width="96" height="38" rx="19" fill="#20312c"/>
    <circle cx="263" cy="83" r="6" fill="none" stroke="#f8efe3" stroke-width="2"/>
    <path d="M263 79v5l4 2" stroke="#f8efe3" stroke-width="2" stroke-linecap="round"/>
    <text class="label small" x="278" y="88" fill="#f8efe3">Replay</text>

    <rect x="36" y="120" width="72" height="30" rx="15" fill="#20312c"/>
    <text class="label chip-text" x="52" y="139" fill="#f8efe3">KL walk</text>
    <rect x="114" y="120" width="86" height="30" rx="15" fill="#20312c"/>
    <text class="label chip-text" x="130" y="139" fill="#f8efe3">Historic</text>
    <rect x="206" y="120" width="56" height="30" rx="15" fill="#edf3ec"/>
    <text class="label chip-text" x="221" y="139" fill="#33413b">Cafe</text>
    <rect x="270" y="120" width="68" height="30" rx="15" fill="#edf3ec"/>
    <text class="label chip-text" x="286" y="139" fill="#33413b">+ filter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="18" y="274" width="354" height="518" rx="34" fill="#fffdf8"/>
    <rect x="160" y="290" width="70" height="5" rx="2.5" fill="#c6cec7"/>
    <text class="label title" x="38" y="326">Filter retrace</text>
    <text class="label small muted" x="38" y="347">27 visits in current scope</text>

    <rect x="274" y="306" width="58" height="30" rx="15" fill="#edf3ec"/>
    <text class="label chip-text" x="291" y="325" fill="#33413b">Clear</text>

    <rect x="38" y="368" width="84" height="32" rx="16" fill="#20312c"/>
    <text class="label chip-text" x="55" y="389" fill="#f8efe3">KL walk</text>
    <rect x="130" y="368" width="104" height="32" rx="16" fill="#20312c"/>
    <text class="label chip-text" x="147" y="389" fill="#f8efe3">Weekend</text>
    <rect x="242" y="368" width="88" height="32" rx="16" fill="#20312c"/>
    <text class="label chip-text" x="257" y="389" fill="#f8efe3">Historic</text>

    <text class="label tiny muted" x="38" y="431">LISTS</text>
    <g>
      <rect x="38" y="448" width="314" height="44" rx="14" fill="#f2f6f0"/>
      <circle cx="61" cy="470" r="11" fill="#20312c"/>
      <path class="check" d="M55 470l4 4 8-9"/>
      <text class="label row-text" x="82" y="468" fill="#24302b">KL walk</text>
      <text class="label tiny muted" x="82" y="483">11 visits</text>
      <rect x="292" y="459" width="38" height="22" rx="11" fill="#dce7df"/>
      <text class="label micro" x="304" y="474" fill="#4e5d55">ON</text>
    </g>
    <g>
      <rect x="38" y="500" width="314" height="44" rx="14" fill="#fffdf8"/>
      <circle class="empty-check" cx="61" cy="522" r="11"/>
      <text class="label row-text" x="82" y="520" fill="#24302b">Coffee crawl</text>
      <text class="label tiny muted" x="82" y="535">8 visits</text>
    </g>
    <g>
      <rect x="38" y="552" width="314" height="44" rx="14" fill="#f2f6f0"/>
      <circle cx="61" cy="574" r="11" fill="#20312c"/>
      <path class="check" d="M55 574l4 4 8-9"/>
      <text class="label row-text" x="82" y="572" fill="#24302b">Weekend saved</text>
      <text class="label tiny muted" x="82" y="587">19 visits</text>
    </g>

    <text class="label tiny muted" x="38" y="625">PLACE TYPES</text>
    <rect x="38" y="644" width="86" height="36" rx="18" fill="#20312c"/>
    <circle cx="57" cy="662" r="5" fill="#d6aa2f"/>
    <text class="label chip-text" x="70" y="666" fill="#f8efe3">Historic</text>
    <rect x="132" y="644" width="70" height="36" rx="18" fill="#edf3ec"/>
    <circle cx="151" cy="662" r="5" fill="#d64b3c"/>
    <text class="label chip-text" x="164" y="666" fill="#33413b">Cafe</text>
    <rect x="210" y="644" width="66" height="36" rx="18" fill="#edf3ec"/>
    <circle cx="229" cy="662" r="5" fill="#247b74"/>
    <text class="label chip-text" x="242" y="666" fill="#33413b">Park</text>
    <rect x="38" y="688" width="84" height="36" rx="18" fill="#edf3ec"/>
    <circle cx="57" cy="706" r="5" fill="#7b5eb1"/>
    <text class="label chip-text" x="70" y="710" fill="#33413b">Gallery</text>
    <rect x="130" y="688" width="86" height="36" rx="18" fill="#edf3ec"/>
    <circle cx="149" cy="706" r="5" fill="#4d6f9f"/>
    <text class="label chip-text" x="162" y="710" fill="#33413b">Library</text>
    <rect x="224" y="688" width="88" height="36" rx="18" fill="#edf3ec"/>
    <circle cx="243" cy="706" r="5" fill="#9a6d4d"/>
    <text class="label chip-text" x="256" y="710" fill="#33413b">Museum</text>

    <rect x="38" y="744" width="314" height="38" rx="19" fill="#20312c"/>
    <text class="label small" x="138" y="767" fill="#f8efe3">Show 27 visits</text>
  </g>

  <rect x="154" y="24" width="82" height="5" rx="2.5" fill="#0f1412" opacity=".86"/>
  <line x1="24" y1="812" x2="366" y2="812" stroke="#20312c" stroke-width="1" stroke-dasharray="4 7" opacity=".22"/>
</svg>
