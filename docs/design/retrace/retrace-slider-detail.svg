      <line class="event" x1="83" y1="520" x2="83" y2="552"/>
      <line class="minor" x1="101" y1="521" x2="101" y2="552"/>
      <line class="event" x1="117" y1="520" x2="117" y2="552"/>
      <line class="event" x1="145" y1="520" x2="145" y2="552"/>
      <line class="event" x1="184" y1="510" x2="184" y2="562"/>
      <line class="event" x1="224" y1="520" x2="224" y2="552"/>
      <line class="minor" x1="242" y1="521" x2="242" y2="552"/>
      <line class="event" x1="257" y1="520" x2="257" y2="552"/>
      <line class="minor" x1="272" y1="521" x2="272" y2="552"/>
      <line class="event" x1="281" y1="520" x2="281" y2="552"/>
      <line class="event" x1="318" y1="520" x2="318" y2="552"/>
      <line class="event" x1="344" y1="514" x2="344" y2="558"/>
