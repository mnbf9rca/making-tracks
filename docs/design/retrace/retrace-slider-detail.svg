    <text class="label" x="94" y="198" style="font-size:22px;font-weight:790">Six years, 168 visits</text>
    <text class="label small" x="94" y="220" fill="#627069">Fast movement crosses the full span</text>

    <line x1="46" y1="262" x2="344" y2="262" stroke="#d9dfd8" stroke-width="12" stroke-linecap="round"/>
    <line x1="46" y1="262" x2="183" y2="262" stroke="#2d8c83" stroke-width="12" stroke-linecap="round"/>
    <line x1="183" y1="262" x2="222" y2="262" stroke="#db5344" stroke-width="12" stroke-linecap="round"/>
    <line class="event" x1="46" y1="239" x2="46" y2="286"/>
    <line class="event" x1="95" y1="247" x2="95" y2="278"/>
    <line class="event" x1="145" y1="247" x2="145" y2="278"/>
    <line class="event" x1="183" y1="236" x2="183" y2="290"/>
    <line class="event" x1="222" y1="247" x2="222" y2="278"/>
    <line class="event" x1="274" y1="247" x2="274" y2="278"/>
    <line class="event" x1="344" y1="239" x2="344" y2="286"/>
    <rect x="199" y="239" width="46" height="46" rx="23" fill="#fffdf8" stroke="#db5344" stroke-width="4"/>
    <circle cx="222" cy="262" r="7" fill="#db5344"/>
    <text class="label micro" x="38" y="232" fill="#627069">2017</text>
    <text class="label micro" x="170" y="234" fill="#627069">2019</text>
    <text class="label micro" x="316" y="232" fill="#627069">2026</text>
  </g>

  <g filter="url(#shadow)">
