    <rect x="201" y="513" width="46" height="46" rx="23" fill="#fffdf8" stroke="#db5344" stroke-width="4"/>
    <circle cx="224" cy="536" r="7" fill="#db5344"/>
    <rect x="194" y="500" width="60" height="30" rx="15" fill="#db5344"/>
    <text class="label" x="206" y="521" style="font-size:12px;font-weight:760" fill="#fffaf2">14:20</text>
    <text class="label micro" x="38" y="507" fill="#627069">10:05</text>
    <text class="label micro" x="112" y="507" fill="#627069">12:40</text>
    <text class="label micro" x="171" y="500" fill="#627069">14:20</text>
    <text class="label micro" x="313" y="507" fill="#627069">17:40</text>
