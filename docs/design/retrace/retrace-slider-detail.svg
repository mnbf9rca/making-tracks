<svg xmlns="http://www.w3.org/2000/svg" width="390" height="640" viewBox="0 0 390 640" role="img" aria-label="Retrace slider showing fast coarse year scrubbing and slowed zoomed visit scrubbing">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#1c2421" flood-opacity="0.24"/>
    </filter>
    <style>
      .label { font-family: Helvetica; letter-spacing: 0; }
      .small { font-size: 12px; font-weight: 650; }
      .micro { font-size: 10px; font-weight: 650; }
      .event { stroke: #6e7b74; stroke-width: 2.2; stroke-linecap: round; }
      .minor { stroke: #9da7a1; stroke-width: 1.5; stroke-linecap: round; opacity: .64; }
    </style>
  </defs>

  <rect width="390" height="640" fill="#e7eee8"/>
  <path d="M0 86c58-26 112-18 168 13 72 40 124 42 222-5v546H0z" fill="#c1d8d5" opacity=".42"/>
  <path d="M0 48c88 45 167 42 237 4 51-28 98-29 153 0" fill="none" stroke="#fffdf7" stroke-width="18" stroke-linecap="round"/>
  <path d="M0 48c88 45 167 42 237 4 51-28 98-29 153 0" fill="none" stroke="#d5ddd4" stroke-width="1.4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="20" y="78" width="350" height="228" rx="32" fill="#fffdf8"/>
    <text class="label" x="38" y="114" style="font-size:20px;font-weight:780">Fast scrub</text>
    <text class="label small" x="38" y="136" fill="#627069">Coarse across scoped years; labels decimate</text>
    <rect x="270" y="98" width="62" height="30" rx="15" fill="#edf3ec"/>
    <text class="label micro" x="282" y="118" fill="#53615a">84 / 168</text>

    <circle cx="58" cy="181" r="20" fill="#20312c"/>
