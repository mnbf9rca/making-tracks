<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T1.1 Snow token validation — pin pop</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; }
  body {
    --ground: #F4F1EA;
    --water: #C9DBE2;
    --park: #DCE5D4;
    --road: #C9BFA8;
    --road-minor: #DDD5C2;
    --surface: #FBFAF2;
    --ink: #2B2823;
    --muted: #6B675F;
    --accent: #0A6B5C;
    --eyebrow: #8A5A2B;
    --hairline: rgba(43, 40, 35, 0.14);
    --pin: #E4572E;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  .canvas { position: relative; width: 390px; height: 844px; background: var(--ground); }
  .map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .label {
    position: absolute;
    z-index: 2;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-shadow:
      -2px -2px 0 var(--ground),
      2px -2px 0 var(--ground),
      -2px 2px 0 var(--ground),
      2px 2px 0 var(--ground);
  }
  .label.one { left: 58px; top: 263px; }
  .label.two { right: 50px; top: 435px; }
  .pin {
    position: absolute;
    z-index: 3;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--pin);
  }
  .pin svg { width: 9px; height: 9px; fill: none; stroke: #FFF; stroke-width: 1.7; }
  .pin.faded { opacity: 0.35; }
  .p1 { left: 71px; top: 199px; }
  .p2 { left: 252px; top: 277px; }
  .p3 { left: 165px; top: 374px; }
  .p4 { left: 298px; top: 511px; }
  .p5 { left: 91px; top: 574px; }
  .evidence {
    position: absolute;
    z-index: 4;
    left: 20px;
    right: 20px;
    top: 24px;
    padding: 16px 18px;
    border: 1px solid var(--hairline);
    border-radius: 18px;
    background: rgba(251, 250, 242, 0.94);
    box-shadow: 0 2px 8px rgba(43, 40, 35, 0.10);
  }
  .eyebrow {
    color: var(--eyebrow);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }
  h1 { margin: 6px 0 4px; font-size: 24px; line-height: 1.15; }
  p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .legend {
    position: absolute;
    z-index: 4;
    left: 20px;
    right: 20px;
    bottom: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 14px;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    background: var(--surface);
  }
  .legend-item { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--pin); border: 1px solid #B8421F; }
  .dot.faded { opacity: 0.35; }
  .swatch { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--hairline); }
  .ground { background: var(--ground); }
  .labels { background: var(--muted); }
</style>
</head>
<body>
<main class="canvas" aria-label="Snow material token validation render">
  <svg class="map" viewBox="0 0 390 844" role="img" aria-label="Snow map with constant orange pins">
    <rect width="390" height="844" fill="#F4F1EA"/>
    <path d="M-30 307 C57 262, 101 311, 157 295 C233 272, 286 210, 427 241 L427 367 C322 346, 268 401, 195 392 C103 382, 62 348,-30 401Z" fill="#C9DBE2"/>
    <path d="M-20 550 C51 507, 96 535, 135 596 C162 637, 129 701, 53 716 C12 724,-12 690,-20 650Z" fill="#DCE5D4"/>
    <path d="M290 359 C349 336, 420 381, 419 445 C417 494, 360 523, 307 486 C270 460, 253 385,290 359Z" fill="#DCE5D4"/>
    <g fill="none" stroke-linecap="round">
      <path d="M-30 160 C72 203, 151 192, 232 136 C287 98, 336 103, 420 145" stroke="#C9BFA8" stroke-width="16"/>
      <path d="M38 844 C79 697, 172 605, 237 519 C308 424, 331 276, 354 -10" stroke="#C9BFA8" stroke-width="15"/>
      <path d="M-18 474 C88 445, 158 468, 237 514 C299 550, 351 576, 414 568" stroke="#DDD5C2" stroke-width="9"/>
      <path d="M8 743 C112 683, 205 704, 276 659 C327 627, 355 596, 414 588" stroke="#DDD5C2" stroke-width="8"/>
      <path d="M42 153 C92 235, 158 247, 212 269 C275 294, 299 330, 336 397" stroke="rgba(43,40,35,0.14)" stroke-width="2"/>
    </g>
  </svg>

  <section class="evidence">
    <div class="eyebrow">T1.1 · Snow material</div>
    <h1>Pins stay the subject</h1>
    <p>Constant #E4572E pins and 35% seen-state over the ratified ground, with independent map-label rows.</p>
  </section>

  <span class="label one">Old Market</span>
  <span class="label two">Riverside Walk</span>

  <span class="pin p1" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 5.5 14 10l4.9.4-3.7 3.2 1.2 4.8-4.4-2.6-4.4 2.6 1.2-4.8-3.7-3.2L10 10Z"/></svg>
  </span>
  <span class="pin p2 faded" aria-hidden="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M4.5 9h3l1.5-2h6l1.5 2h3v10h-15Z"/></svg>
  </span>
  <span class="pin p3" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M5 10 12 6l7 4M6 18h12M7 11v6m3-6v6m4-6v6m3-6v6"/></svg>
  </span>
  <span class="pin p4 faded" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 5.5 14 10l4.9.4-3.7 3.2 1.2 4.8-4.4-2.6-4.4 2.6 1.2-4.8-3.7-3.2L10 10Z"/></svg>
  </span>
  <span class="pin p5" aria-hidden="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M4.5 9h3l1.5-2h6l1.5 2h3v10h-15Z"/></svg>
  </span>

  <section class="legend" aria-label="Token evidence">
    <div class="legend-item"><span class="dot"></span>pin · 100%</div>
    <div class="legend-item"><span class="dot faded"></span>pinFaded · 35%</div>
    <div class="legend-item"><span class="swatch ground"></span>ground · #F4F1EA</div>
    <div class="legend-item"><span class="swatch labels"></span>labels · #6B675F</div>
  </section>
</main>
</body>
</html>
