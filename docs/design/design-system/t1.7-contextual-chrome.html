<style>
  * { box-sizing: border-box; }

  body {

  .map-pin { fill: #E4572E; stroke: var(--surface); stroke-width: 2; }

  .proof-title { position: absolute; z-index: 1; top: 16px; left: 14px; color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .toast-stack { position: absolute; z-index: 2; top: 173px; left: 16px; right: 16px; display: grid; gap: 12px; }
  .state { display: grid; gap: 4px; }
  .state-label { margin-left: 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .toast { min-width: 0; padding: 12px; border: 1px solid var(--hairline); border-radius: 16px; background: rgba(251,250,242,.72); box-shadow: 0 4px 16px rgba(43,40,35,.1); -webkit-backdrop-filter: blur(16px) saturate(120%); backdrop-filter: blur(16px) saturate(120%); }
  .toast-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .message { min-width: 0; flex: 1; font-size: 17px; line-height: 1.25; }
  .icon { flex: none; display: grid; width: 22px; height: 22px; place-items: center; color: var(--accent); }
  .action { flex: none; min-width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .quiet { color: var(--muted); }
  .filled { padding: 0 16px; background: var(--accent); color: var(--accent-contrast); }
  .tonal { padding: 0 16px; background: rgba(10,107,92,.12); color: var(--accent); }
  .dismiss { color: var(--ink); font-size: 23px; font-weight: 400; }
  .download { display: grid; gap: 8px; }
  .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .count { flex: none; color: var(--muted); font-size: 13px; }
  .track { height: 3px; overflow: hidden; border-radius: 99px; background: var(--hairline); }
  .fill { width: 42%; height: 3px; border-radius: 99px; background: var(--accent); }
  .fold { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; border-top: 2px dashed #C0392B; }
  .fold-label { position: absolute; z-index: 4; right: 6px; bottom: 4px; padding: 1px 4px; border-radius: 3px; background: rgba(251,250,242,.94); color: #C0392B; font-size: 9px; font-weight: 700; }
  svg { overflow: visible; } .stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
</style>
