<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>A1 Journal and Explore implementation evidence</title>
<style>
  @font-face {
    font-family: "Newsreader";
    src: url("../../../ios/App/Resources/Fonts/Newsreader16pt-SemiBold.ttf");
    font-weight: 600;
  }

  :root {
    --ground: #f4f1ea;
    --water: #c9dbe2;
    --park: #dce5d4;
    --road: #c9bfa8;
    --surface: #fbfaf2;
    --raised: #ffffff;
    --ink: #2b2823;
    --muted: #6b675f;
    --accent: #0a6b5c;
    --hairline: rgba(43, 40, 35, 0.14);
    --scrim: rgba(43, 40, 35, 0.35);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    --serif: "Newsreader", Georgia, serif;
  }

  * { box-sizing: border-box; }

  html,
  body {
    width: 390px;
    height: 844px;
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    background: var(--ground);
    font-family: var(--sans);
  }

  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    background:
      linear-gradient(22deg, transparent 0 46%, var(--road) 47% 49%, transparent 50%),
      radial-gradient(ellipse at 18% 25%, var(--park) 0 12%, transparent 13%),
      linear-gradient(112deg, var(--ground) 0 55%, var(--water) 56% 68%, var(--ground) 69%);
  }

  .status {
    position: absolute;
    z-index: 4;
    inset: 0 0 auto;
    height: 46px;
    padding: 13px 25px 0;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 700;
  }

  .scrim {
    position: absolute;
    inset: 0;
    background: var(--scrim);
  }

  .sheet {
    position: absolute;
    z-index: 2;
    inset: 62px 0 0;
    padding: 10px 16px 14px;
    overflow: hidden;
    border-radius: 22px 22px 0 0;
    background: var(--surface);
    box-shadow: 0 -6px 18px rgba(43, 40, 35, 0.16);
  }

  .grabber {
    width: 36px;
    height: 5px;
    margin: 0 auto 3px;
    border-radius: 999px;
    background: var(--hairline);
  }

  .close {
    width: 44px;
    height: 44px;
    margin-left: auto;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 25px;
    line-height: 1;
  }

  h1 {
    margin: -5px 0 0;
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.1;
  }

  .subtitle {
    margin-top: 3px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.3;
  }

  .scope-head {
    margin: 18px 2px 11px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .section-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
  }

  .scope-all {
    color: var(--accent);
    font-size: 12px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    min-height: 22px;
    padding: 2px 9px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 999px;
    color: var(--surface);
    background: var(--accent);
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
  }

  .chip i {
    width: 11px;
    font-style: normal;
    text-align: center;
  }

  .scope-rows {
    margin-top: 14px;
    border-top: 1px solid var(--hairline);
  }

  .scope-row {
    min-height: 52px;
    padding: 6px 2px;
    display: grid;
    grid-template-columns: 24px 1fr 44px;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--hairline);
    font-size: 15px;
    font-weight: 600;
  }

  .scope-icon {
    color: var(--accent);
    font-size: 20px;
  }

  .switch {
    position: relative;
    width: 44px;
    height: 28px;
    border-radius: 999px;
    background: rgba(107, 103, 95, .28);
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
  }

  .switch.on { background: var(--accent); }
  .switch.on::after { left: 19px; }

  .quiet {
    margin-top: 16px;
    border-top: 1px solid var(--hairline);
  }

  .quiet-row {
    min-height: 54px;
    padding: 9px 2px;
    display: grid;
    grid-template-columns: 24px 1fr 12px;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--hairline);
    color: var(--muted);
  }

  .quiet-row.settings { color: var(--accent); }

  .quiet-title {
    color: inherit;
    font-size: 15px;
    font-weight: 600;
  }

  .quiet-row.settings .quiet-title { color: var(--ink); }

  .quiet-meta {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
  }

  .hero {
    margin-top: 18px;
    padding: 16px;
    display: grid;
    grid-template-columns: 38px 1fr auto;
    align-items: center;
    gap: 12px;
    border-radius: 14px;
    background: var(--raised);
    box-shadow: 0 6px 16px rgba(43, 40, 35, .13);
  }

  .hero-icon {
    color: var(--accent);
    font-size: 27px;
  }

  .hero-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
  }

  .meta,
  .count {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .retrace {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
  }

  .journal-label {
    margin: 18px 2px 8px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .11em;
  }

  .list-row {
    min-height: 52px;
    padding: 8px 2px;
    border-bottom: 1px solid var(--hairline);
  }

  .list-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .list-title {
    font-size: 15px;
    font-weight: 600;
  }

  .track {
    height: 4px;
    margin-top: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(107, 103, 95, .20);
  }

  .track span {
    display: block;
    height: 100%;
    background: var(--accent);
  }

  .new-list,
  .virtual {
    min-height: 48px;
    padding: 8px 2px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--hairline);
    font-size: 15px;
    font-weight: 600;
  }

  .new-list,
  .virtual i {
    color: var(--accent);
  }

  .virtual .count {
    margin: 0 0 0 auto;
  }

  .fold {
    position: absolute;
    z-index: 5;
    inset: auto 0 0;
    height: 1px;
    background: #e4572e;
  }

  .ax .sheet { top: 48px; }
  .ax h1 { font-size: 41px; }
  .ax .subtitle { margin-top: 6px; font-size: 22px; }
  .ax .scope-head { margin-top: 14px; margin-bottom: 9px; }
  .ax .section-label,
  .ax .journal-label { font-size: 17px; }
  .ax .scope-all { font-size: 17px; }
  .ax .chips { gap: 8px; }
  .ax .chip {
    min-height: 38px;
    padding: 5px 14px;
    gap: 6px;
    font-size: 19px;
  }
  .ax .scope-row {
    min-height: 86px;
    grid-template-columns: 30px 1fr 51px;
    gap: 14px;
    font-size: 23px;
  }
  .ax .scope-icon { font-size: 30px; }
  .ax .switch { width: 51px; height: 31px; }
  .ax .switch::after { width: 25px; height: 25px; }
  .ax .switch.on::after { left: 23px; }
  .ax .quiet { margin-top: 14px; }
  .ax .quiet-row {
    min-height: 86px;
    grid-template-columns: 30px 1fr 18px;
    gap: 14px;
  }
  .ax .quiet-title { font-size: 24px; }
  .ax .quiet-meta { margin-top: 4px; font-size: 18px; }
  .ax .hero {
    grid-template-columns: 48px 1fr;
    align-items: start;
  }
  .ax .hero-icon { font-size: 36px; }
  .ax .hero-title { font-size: 29px; }
  .ax .meta { font-size: 18px; line-height: 1.25; }
  .ax .retrace {
    grid-column: 1 / -1;
    font-size: 19px;
  }
  .ax .journal-label { margin-top: 14px; }
  .ax .list-row { min-height: 78px; }
  .ax .list-title { font-size: 23px; }
  .ax .count { font-size: 18px; }
  .ax .new-list,
  .ax .virtual {
    min-height: 72px;
    font-size: 23px;
  }
</style>
</head>
<body>
<main class="phone" id="phone">
  <div class="status"><span>9:41</span><span>●●● ◉ ▰</span></div>
  <div class="scrim"></div>
  <section class="sheet" id="surface"></section>
  <div class="fold" aria-label="390 by 844 fold"></div>
</main>

<template id="explore">
  <div class="grabber"></div><div class="close">×</div>
  <h1>Explore</h1>
  <div class="subtitle">what the map shows right now</div>
  <!-- DS-11 reserves the Search position and renders nothing in A1. -->
  <div class="scope-head">
    <span class="section-label">Scope</span>
    <span class="scope-all">Hide all categories</span>
  </div>
  <div class="chips">
    <span class="chip"><i>⌘</i>Archaeological</span>
    <span class="chip"><i>◈</i>Artwork</span>
    <span class="chip"><i>★</i>Attraction</span>
    <span class="chip"><i>▦</i>Historic Building</span>
    <span class="chip"><i>⚑</i>Memorial</span>
    <span class="chip"><i>◉</i>Museum</span>
    <span class="chip"><i>▥</i>Religious</span>
    <span class="chip"><i>?</i>Other</span>
  </div>
  <div class="scope-rows">
    <div class="scope-row">
      <span class="scope-icon">◌</span>
      <span>Include hidden places</span>
      <span class="switch"></span>
    </div>
    <div class="scope-row">
      <span class="scope-icon">▧</span>
      <span>Show offline coverage shading</span>
      <span class="switch on"></span>
    </div>
  </div>
  <div class="quiet">
    <div class="quiet-row settings">
      <span>⚙</span>
      <div><div class="quiet-title">Settings</div><div class="quiet-meta">appearance, data, location, storage</div></div>
      <span>›</span>
    </div>
    <div class="quiet-row">
      <span>▤</span>
      <div><div class="quiet-title">About</div><div class="quiet-meta">the story · privacy · licences</div></div>
      <span>›</span>
    </div>
  </div>
</template>

<template id="journal">
  <div class="grabber"></div><div class="close">×</div>
  <h1>Journal</h1>
  <div class="subtitle">your story through the world</div>
  <div class="hero">
    <span class="hero-icon">♟</span>
    <div><div class="hero-title">My tracks</div><div class="meta">214 visits · last: Riverside Plaques</div></div>
    <span class="retrace">Retrace ›</span>
  </div>
  <div class="journal-label">LISTS</div>
  <div class="list-row">
    <div class="list-top"><span class="list-title">Ghost signs</span><span class="count">4 of 11 seen</span></div>
    <div class="track"><span style="width:36%"></span></div>
  </div>
  <div class="list-row">
    <div class="list-top"><span class="list-title">KL follies</span><span class="count">7 of 9 seen</span></div>
    <div class="track"><span style="width:78%"></span></div>
  </div>
  <div class="new-list"><span>＋</span><span>New list</span></div>
  <div class="virtual"><i>♡</i><span>Loved places</span><span class="count">8</span></div>
  <div class="virtual"><i>◌</i><span>Hidden places</span><span class="count">3</span></div>
</template>

<script>
  const params = new URLSearchParams(location.search);
  const variant = params.get("variant") || "explore";
  const isJournal = variant.startsWith("journal");
  const isAX = variant.endsWith("-ax");
  document.getElementById("phone").classList.toggle("ax", isAX);
  document.getElementById("surface").append(
    document.getElementById(isJournal ? "journal" : "explore").content.cloneNode(true)
  );
  document.title = `A1 ${variant} implementation evidence · 390×844`;
</script>
</body>
</html>
